<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano - Music Melody</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado encabezado-instrumento">
    <div class="contenido-encabezado">
      <a href="index.html" class="enlace-volver">&larr; Volver al inicio</a>
      <h1>Piano</h1>
      <p>Haz clic en las teclas o usa tu teclado para tocar</p>
    </div>
  </header>

  <main class="contenedor-instrumento">
    <div class="piano">
      <div class="tecla tecla-blanca" data-nota="C4">C</div>
      <div class="tecla tecla-negra" data-nota="Db4" style="left: 8.5%;">C#</div>

      <div class="tecla tecla-blanca" data-nota="D4">D</div>
      <div class="tecla tecla-negra" data-nota="Eb4" style="left: 21%;">D#</div>

      <div class="tecla tecla-blanca" data-nota="E4">E</div>

      <div class="tecla tecla-blanca" data-nota="F4">F</div>
      <div class="tecla tecla-negra" data-nota="Gb4" style="left: 46%;">F#</div>

      <div class="tecla tecla-blanca" data-nota="G4">G</div>
      <div class="tecla tecla-negra" data-nota="Ab4" style="left: 58.5%;">G#</div>

      <div class="tecla tecla-blanca" data-nota="A4">A</div>
      <div class="tecla tecla-negra" data-nota="Bb4" style="left: 71%;">A#</div>

      <div class="tecla tecla-blanca" data-nota="B4">B</div>

      <div class="tecla tecla-blanca" data-nota="C5">C</div>
    </div>
  </main>

  <footer class="pie-pagina">

  </footer>

  <script src="js/main.js"></script>
