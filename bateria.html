<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batería - Music Melody</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado encabezado-instrumento">
    <div class="contenido-encabezado">
      <a href="index.html" class="enlace-volver">&larr; Volver al inicio</a>
      <h1>Batería</h1>
      <p>Haz clic en cada pieza para escucharla, o usa las teclas Q W E A S D</p>
    </div>
  </header>

  <main class="contenedor-instrumento">
    <div class="bateria">
      <div class="pieza pieza-platillo" data-sonido="hihat" data-tecla="Q">
        <span>Hi-Hat</span>
      </div>
      <div class="pieza pieza-tom" data-sonido="tom1" data-tecla="W">
        <span>Tom 1</span>
      </div>
      <div class="pieza pieza-tom" data-sonido="tom2" data-tecla="E">
        <span>Tom 2</span>
      </div>
      <div class="pieza pieza-caja" data-sonido="snare" data-tecla="A">
        <span>Caja</span>
      </div>
      <div class="pieza pieza-bombo" data-sonido="kick" data-tecla="S">
        <span>Bombo</span>
      </div>
      <div class="pieza pieza-platillo pieza-crash" data-sonido="crash" data-tecla="D">
        <span>Crash</span>
      </div>
    </div>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 Music Melody &middot; Proyecto de grado</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
